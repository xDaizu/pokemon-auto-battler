name: Deploy

# The automated version of docs/RELEASING.md sections 2-5: preflight, migrate,
# deploy the API, deploy Hosting, verify. Section 6 (rollback) stays manual on
# purpose.
#
# Configuration lives in GitHub, not in this file -- see docs/PROVISIONING.md
# section 8 for the one-time setup and the full list of variables and secrets.
# Nothing here holds a credential: authentication is Workload Identity
# Federation, and SESSION_SECRET / DATABASE_AUTH_TOKEN never leave Secret
# Manager.
#
# Job shape is driven by the approval gate. GitHub creates a deployment record
# per job and a required reviewer gates each one, so every extra job declaring
# `environment: production` is another click. Migrating, deploying the API and
# deploying Hosting have to happen in that order anyway, so splitting them
# across jobs would buy nothing but log granularity and cost two more
# approvals. They are one job. `plan` and `verify` touch no credentials and
# stay separate, costing nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: Which half to deploy
        type: choice
        options: [both, api, hosting]
        default: both
      run_migrations:
        description: Run pending migrations first
        type: boolean
        default: true

# Never run two deploys at once, and never cancel one in flight: a half-finished
# `gcloud run deploy` is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # docs/RELEASING.md section 2. `git status --short` has no equivalent here -- the
  # runner deploys a checkout of the pushed commit, so what ships is what is
  # committed, which is the property that check was protecting.
  test:
    uses: ./.github/workflows/ci.yml

  # docs/RELEASING.md section 1: deploy only what changed. On a push that is
  # the diff of the pushed range; on a manual run it is whatever was asked for.
  # When the
  # range cannot be resolved (force push, first push on a branch) the answer is
  # "deploy everything", which section 1 calls harmless.
  #
  # No `environment:` here, deliberately. It would add an approval click, and it
  # would fire before you could read the summary table this job writes -- which
  # is the very thing worth reading before approving.
  plan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.plan.outputs.api }}
      hosting: ${{ steps.plan.outputs.hosting }}
      migrations: ${{ steps.plan.outputs.migrations }}
    steps:
      # Variables only. Secrets are checked in the deploy job, which is where
      # they are first needed and which works whether they are scoped to the
      # repository or to the environment.
      - name: Check the deploy configuration is complete
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          VITE_BASE: ${{ vars.VITE_BASE }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -uo pipefail
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION CLOUD_RUN_SERVICE BASE_PATH \
                      VITE_BASE SITE_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub variables: ${missing[*]}. See docs/PROVISIONING.md section 8."
            exit 1
          fi
          # VITE_BASE must keep its trailing slash: vite reads it as `base`,
          # and without it every asset 404s under /battler/
          # (docs/RELEASING.md section 4).
          case "$VITE_BASE" in
            */) ;;
            *) echo "::error::VITE_BASE ('$VITE_BASE') must end in a slash."; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          TARGETS: ${{ inputs.targets }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          api=true; hosting=true; migrations=true

          if [ "$EVENT" = workflow_dispatch ]; then
            case "$TARGETS" in
              api)     hosting=false ;;
              hosting) api=false ;;
            esac
            migrations="$RUN_MIGRATIONS"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$SHA")
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
            match() { if echo "$changed" | grep -qE "$1"; then echo true; else echo false; fi; }
            api=$(match '^(src/|shared/|Dockerfile$|package(-lock)?\.json$|tsconfig\.json$|\.dockerignore$|scripts/deploy-api\.ps1$)')
            hosting=$(match '^(frontend/|shared/|firebase\.json$)')
            migrations=$(match '^src/db/migrations/')
          else
            echo "Cannot resolve the pushed range; deploying everything."
          fi

          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "api=$api"               >> "$GITHUB_OUTPUT"
          echo "hosting=$hosting"       >> "$GITHUB_OUTPUT"
          {
            echo "### What this run will deploy"
            echo ""
            echo "| Step | Running |"
            echo "|---|---|"
            echo "| Migrations | \`$migrations\` |"
            echo "| API to Cloud Run | \`$api\` |"
            echo "| Frontend to Hosting | \`$hosting\` |"
            echo ""
            echo "Read this before approving the \`deploy\` job."
          } >> "$GITHUB_STEP_SUMMARY"

  # docs/RELEASING.md sections 3 and 4, in the order those sections mandate:
  # migrations first (never after the API), then the API, then Hosting -- so a
  # frontend expecting a new endpoint never goes live before the endpoint does.
  # One job, so one approval. Every step is individually conditional.
  deploy:
    needs: plan
    if: ${{ needs.plan.outputs.api == 'true' || needs.plan.outputs.hosting == 'true' || needs.plan.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - name: Check the deploy secrets are present
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -uo pipefail
          missing=()
          for name in WIF_PROVIDER DEPLOY_SA DATABASE_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}. See docs/PROVISIONING.md section 8."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Both lockfiles: the cached directory is the shared ~/.npm store, so
          # one restore serves the root install and the frontend one.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      # --- docs/RELEASING.md section 3: migrations, before anything else ----------
      #
      # scripts/migrate-prod.ps1 is not reused: it shells out through `cmd /c`,
      # which no Linux runner has, and the workstation footgun it guards -- a
      # shell left pointed at production -- cannot happen in a container that is
      # thrown away.
      - name: Install root dependencies
        if: needs.plan.outputs.migrations == 'true'
        run: npm ci

      # The token is read from Secret Manager rather than stored in GitHub, so
      # rotating it (docs/RELEASING.md section 8) needs no change here. It is
      # exported inside this one step rather than written to $GITHUB_ENV, so it
      # is not live for the Cloud Run and Firebase steps below.
      - name: Run migrations
        if: needs.plan.outputs.migrations == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Strip a leading UTF-8 BOM. Windows PowerShell prepends one to
          # anything piped into a native command, so `$value | gh secret set
          # NAME` stores the secret with an invisible EF BB BF on the front.
          # docs/RELEASING.md section 7 -- this cost a failed production revision.
          DATABASE_URL=${DATABASE_URL#$'\uFEFF'}
          case "$DATABASE_URL" in
            file:*) echo "::error::DATABASE_URL is a local file URL. Refusing to run as prod."; exit 1 ;;
            libsql://*|https://*|http://*) ;;
            *) echo "::error::DATABASE_URL does not start with a known scheme."; exit 1 ;;
          esac
          # GitHub masks the secret verbatim; the bare hostname is a substring of
          # it and would otherwise print in the clear.
          host=${DATABASE_URL#*://}; host=${host%%/*}
          [ -n "$host" ] || { echo "::error::DATABASE_URL has no host."; exit 1; }
          echo "::add-mask::$host"
          DATABASE_AUTH_TOKEN=$(gcloud secrets versions access latest \
            --secret=DATABASE_AUTH_TOKEN --project="$GCP_PROJECT_ID")
          echo "::add-mask::$DATABASE_AUTH_TOKEN"
          export DATABASE_URL DATABASE_AUTH_TOKEN
          npm run migrate

      # --- docs/RELEASING.md section 4: API -> Cloud Run --------------------------
      #
      # The flag block is deliberately NOT repeated here: `gcloud run deploy`
      # replaces the configuration it is given, so a second copy that drifted
      # would silently strip the service's secrets. The runner calls the same
      # script a workstation does, with .env.prod synthesised in a temp dir --
      # never in the repo, which `--source .` would upload.
      - name: Write .env.prod outside the source tree
        if: needs.plan.outputs.api == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          DATABASE_URL=${DATABASE_URL#$'\uFEFF'}
          host=${DATABASE_URL#*://}; host=${host%%/*}
          if [ -z "$host" ]; then
            echo "::error::DATABASE_URL has no host. A BOM or stray whitespace is the usual cause."
            exit 1
          fi
          echo "::add-mask::$host"
          umask 077
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > "$RUNNER_TEMP/.env.prod"

      - name: Deploy to Cloud Run
        if: needs.plan.outputs.api == 'true'
        shell: pwsh
        run: |
          ./scripts/deploy-api.ps1 `
            -Project  $env:GCP_PROJECT_ID `
            -Region   $env:GCP_REGION `
            -Service  $env:CLOUD_RUN_SERVICE `
            -BasePath $env:BASE_PATH `
            -EnvFile  (Join-Path $env:RUNNER_TEMP '.env.prod')

      # --- docs/RELEASING.md section 4: frontend -> Firebase Hosting --------------
      #
      # hosting/ is gitignored build output and the runner starts empty, so the
      # "always rebuild" rule is structural here rather than something to
      # remember.
      - name: Install frontend dependencies
        if: needs.plan.outputs.hosting == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build the SPA
        if: needs.plan.outputs.hosting == 'true'
        working-directory: frontend
        env:
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build

      # firebase-tools picks up the credentials the auth step wrote to
      # GOOGLE_APPLICATION_CREDENTIALS; no long-lived CI token is involved.
      - name: Deploy to Firebase Hosting
        if: needs.plan.outputs.hosting == 'true'
        run: |
          npx --yes firebase-tools deploy --only hosting \
            --project "$GCP_PROJECT_ID" --non-interactive \
            --message "${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}"

  # docs/RELEASING.md section 5, minus the browser check -- log in and reload
  # by hand after anything touching sessions, cookies or firebase.json. No
  # environment,
  # so it costs no approval: it only reads the public site.
  verify:
    needs: [plan, deploy]
    if: ${{ !cancelled() && !failure() && (needs.plan.outputs.api == 'true' || needs.plan.outputs.hosting == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployed site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          set -uo pipefail
          base="${SITE_URL%/}"
          failed=0

          check() {
            local label=$1 url=$2 want=$3 got
            # --retry absorbs the first request paying a Cloud Run cold start.
            got=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 \
                    --retry 3 --retry-all-errors "$url") || got=000
            if [ "$got" = "$want" ]; then
              echo "  ok   $label -> $got"
            else
              echo "::error::$label expected $want, got $got ($url)"
              failed=1
            fi
          }

          check "API reachable through the Hosting rewrite" "$base$BASE_PATH/api/species" 200
          check "API rejects the anonymous caller"          "$base$BASE_PATH/api/roster"  401

          # The apex redirect: exactly one hop, ending in a 200. More hops means
          # the trailing-slash loop from docs/RELEASING.md section 7 is back.
          result=$(curl -sS -L -o /dev/null -w '%{http_code} %{num_redirects}' \
                     --max-time 45 "$base/") || result="000 0"
          code=${result% *}; hops=${result#* }
          if [ "$code" = 200 ] && [ "$hops" = 1 ]; then
            echo "  ok   apex redirects once to $BASE_PATH/ -> 200"
          else
            echo "::error::apex expected 200 after 1 redirect, got $code after $hops"
            failed=1
          fi

          exit $failed
